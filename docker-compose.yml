
services:

  # ─── PHP-FPM / Drupal Application ────────────────────────────────────────────
  drupal:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: drupal_app
    restart: unless-stopped
    volumes:
      # Mount entire Drupal codebase (composer-managed)
      - ./drupal:/var/www/html:cached
      # Persistent private file storage (outside web root)
      - drupal_private_files:/var/www/private
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      DRUPAL_DB_NAME: ${POSTGRES_DB:-drupal}
      DRUPAL_DB_USER: ${POSTGRES_USER:-drupal}
      DRUPAL_DB_PASSWORD: ${POSTGRES_PASSWORD:-drupal_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drupal_net

  # ─── Nginx Web Server ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: drupal_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./drupal:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - drupal
    networks:
      - drupal_net

  # ─── PostgreSQL 16 + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: drupal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drupal}
      POSTGRES_USER: ${POSTGRES_USER:-drupal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drupal_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script: enables pgvector extension on first start
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drupal} -d ${POSTGRES_DB:-drupal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - drupal_net

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  drupal_private_files:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  drupal_net:
    driver: bridge
