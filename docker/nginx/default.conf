server {
    listen 80;
    server_name localhost;

    # ─── Document root ────────────────────────────────────────────────────────
    root /var/www/html/web;
    index index.php;

    # ─── Client body size (match PHP upload limits) ───────────────────────────
    client_max_body_size 128M;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── Drupal: Clean URLs (try_files + index.php fallback) ─────────────────
    location / {
        try_files $uri /index.php?$query_string;
    }

    # ─── PHP-FPM passthrough ──────────────────────────────────────────────────
    location ~ \.php$ {
        # Protect against PHP injection in uploads directory
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass   drupal:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;

        include        fastcgi_params;

        # Increase timeouts for slow AI/vector operations
        fastcgi_read_timeout  300s;
        fastcgi_send_timeout  300s;
        fastcgi_connect_timeout 60s;
    }

    # ─── Drupal: Private files must NOT be served by Nginx directly ──────────
    location ~* ^/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    # ─── Drupal: Image styles on-the-fly generation ───────────────────────────
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri /index.php?$query_string;
    }

    # ─── Static asset caching & dynamic aggregate fallback ───────────────────
    location ~* \.(css|gif|ico|jpeg|jpg|js|png|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        expires max;
        log_not_found off;
    }

    # ─── Block access to hidden files / sensitive paths ───────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(README|INSTALL|CHANGELOG|LICENSE|MAINTAINERS|UPGRADE)\.(txt|md)$ {
        deny all;
    }

    # ─── Block xmlrpc.php ─────────────────────────────────────────────────────
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/drupal_access.log;
    error_log  /var/log/nginx/drupal_error.log;
}
