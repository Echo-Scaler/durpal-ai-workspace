; ─── Drupal-optimized PHP Configuration ──────────────────────────────────────

[PHP]
; Memory limit (Drupal recommends 256MB+, AI/vector ops need more)
memory_limit = 512M

; File upload limits for document processing (PDF/DOCX)
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300

; Error reporting (disable display in production, log to file)
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Opcache settings for performance
[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; Date timezone
[Date]
date.timezone = UTC
